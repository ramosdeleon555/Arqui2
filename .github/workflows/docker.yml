name: Build and Push Docker Image

on:
  push:
    branches:
      - assignment-04

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/assignment-04:${{ github.sha }} \
                       -t ${{ secrets.DOCKERHUB_USERNAME }}/assignment-04:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/assignment-04:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/assignment-04:latest